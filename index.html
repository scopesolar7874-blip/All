<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>درخواست برائے انتظامیہ</title>
<style>
  html, body { margin: 0; height: 100%; background: #fdfcfa; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  /* نیچے بیج کو ڈھانپنے والا پردہ */
  .cover {
    position: fixed; right: 0; bottom: 0;
    width: 260px; height: 70px;
    background: #fdfcfa;
    z-index: 10;
  }
</style>
</head>
<body>
  <iframe src="https://shared-signature-board.lovable.app/"></iframe>
  <div class="cover"></div>
</body>
</html>
